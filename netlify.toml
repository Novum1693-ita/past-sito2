[build]
  command   = "node scripts/genera-indici.js"
  functions = "netlify/functions"

# Trigger automatico: quando Netlify finisce un deploy,
# chiama la function per aggiornare gli index.json
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Redirect opzionale per l'admin CMS
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Pagine luogo dinamiche
[[redirects]]
  from = "/luoghi/:slug"
  to = "/luoghi/_luogo.html"
  status = 200

# Pagine evento dinamiche
[[redirects]]
  from = "/eventi/:slug"
  to = "/eventi/evento-template.html"
  status = 200

# Pagine notizia dinamiche
[[redirects]]
  from = "/notizie/:slug"
  to = "/notizie/_notizia.html"
  status = 200

# Pagine EN dinamiche
[[redirects]]
  from = "/en/:slug"
  to = "/en/_pagina.html"
  status = 200
