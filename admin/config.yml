# ============================================================
# P.A.S.T. — Configurazione Decap CMS
# ============================================================

backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "it"

collections:

  # ── EVENTI ─────────────────────────────────────────────────
  - name: "eventi"
    label: "📅 Eventi"
    label_singular: "Evento"
    folder: "_eventi"
    create: true
    slug: "{{fields.titolo}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Titolo evento"
        name: "titolo"
        widget: "string"
        hint: "Es: Apertura straordinaria Duomo San Giorgio"
      - label: "Sottotitolo"
        name: "sottotitolo"
        widget: "string"
        hint: "Es: Ore 20:00 · Duomo San Giorgio"
      - label: "Giorno"
        name: "giorno"
        widget: "string"
        hint: "Solo il numero del giorno — es: 23"
      - label: "Mese"
        name: "mese"
        widget: "string"
        hint: "Abbreviazione 3 lettere — es: Apr, Mag, Giu"
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Inaugurazione", value: "inaugurazione" }
          - { label: "Apertura serale", value: "apertura" }
          - { label: "Proiezione", value: "proiezione" }
          - { label: "Incontro / Conferenza", value: "incontro" }
          - { label: "Workshop", value: "workshop" }
          - { label: "Altro", value: "altro" }
      - label: "Testo anteprima"
        name: "anteprima"
        widget: "text"
        hint: "Breve descrizione visibile nella griglia eventi"
      - label: "Descrizione completa"
        name: "descrizione"
        widget: "markdown"
      - label: "Luogo"
        name: "luogo"
        widget: "string"
      - label: "Orario"
        name: "orario"
        widget: "string"
        hint: "Es: 20:00 – 23:00"
      - label: "Data completa"
        name: "data_completa"
        widget: "string"
        hint: "Es: 24 Aprile 2025"
      - label: "Prezzo / Ingresso"
        name: "prezzo"
        widget: "string"
        hint: "Es: € 5,00 — oppure: Ingresso libero"
      - label: "Sottotitolo prezzo"
        name: "sub_prezzo"
        widget: "string"
        required: false
      - label: "Tipo prenotazione"
        name: "tipo_prenotazione"
        widget: "select"
        options:
          - { label: "Eventbrite", value: "eventbrite" }
          - { label: "Regiondo", value: "regiondo" }
          - { label: "Ingresso libero (nessuna prenotazione)", value: "free" }
      - label: "Link prenotazione (Eventbrite)"
        name: "link_prenotazione"
        widget: "string"
        required: false
      - label: "Widget Regiondo (uno o più)"
        name: "widgets_regiondo"
        widget: "list"
        required: false
        hint: "Aggiungi uno o più widget Regiondo per questo evento"
        fields:
          - label: "Etichetta (es: Biglietto intero)"
            name: "etichetta"
            widget: "string"
            required: false
          - label: "Widget ID (UUID)"
            name: "id"
            widget: "string"
            hint: "Es: cc29ea83-e3f8-48be-9edb-47d86097e8d8"
      - label: "Badge 1"
        name: "badge1"
        widget: "select"
        required: false
        options:
          - { label: "Inaugurazione", value: "badge-mostra" }
          - { label: "Workshop", value: "badge-workshop" }
          - { label: "Spettacolo", value: "badge-spettacolo" }
          - { label: "Incontro", value: "badge-incontro" }
          - { label: "Ingresso libero", value: "badge-gratuito" }
      - label: "Badge 2 (opzionale)"
        name: "badge2"
        widget: "select"
        required: false
        options:
          - { label: "Nessuno", value: "" }
          - { label: "Ingresso libero", value: "badge-gratuito" }
          - { label: "Workshop", value: "badge-workshop" }
      - label: "Immagine hero (banner grande in cima)"
        name: "immagine_hero"
        widget: "image"
        required: false
        hint: "Foto usata come sfondo del banner in cima alla pagina evento"
      - label: "Immagine nel corpo (locandina / foto)"
        name: "immagine_corpo"
        widget: "image"
        required: false
        hint: "Foto o locandina mostrata nel testo descrittivo"
      - label: "URL pagina evento (generato automaticamente)"
        name: "url"
        widget: "string"
        required: false
        hint: "Lascia vuoto — viene generato dalla Netlify Function"

  # ── NOTIZIE ────────────────────────────────────────────────
  - name: "notizie"
    label: "📰 Notizie"
    label_singular: "Notizia"
    folder: "_notizie"
    create: true
    slug: "{{fields.titolo}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Titolo notizia"
        name: "titolo"
        widget: "string"
      - label: "Testo anteprima"
        name: "anteprima"
        widget: "text"
      - label: "Contenuto completo"
        name: "contenuto"
        widget: "markdown"
      - label: "Data pubblicazione"
        name: "data"
        widget: "string"
        hint: "Es: 20 marzo 2025"
      - label: "Categoria"
        name: "badge_testo"
        widget: "select"
        options:
          - { label: "Annuncio", value: "Annuncio" }
          - { label: "Evento", value: "Evento" }
          - { label: "Luogo", value: "Luogo" }
          - { label: "Associazione", value: "Associazione" }

  # ── LUOGHI ─────────────────────────────────────────────────
  - name: "luoghi"
    label: "📍 Luoghi"
    label_singular: "Luogo"
    folder: "_luoghi"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Nome del luogo"
        name: "titolo"
        widget: "string"
      - label: "Slug (identificatore URL)"
        name: "slug"
        widget: "string"
        hint: "Usa solo lettere minuscole e trattini — es: san-giovanni. Determina l'URL della pagina."
      - label: "Categoria principale"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Museo", value: "Musei" }
          - { label: "Chiesa", value: "Chiese" }
          - { label: "Unicità", value: "Unicità" }
      - label: "Tag secondario (opzionale)"
        name: "tag_extra"
        widget: "string"
        required: false
        hint: "Es: Chiese — appare come secondo badge"
      - label: "Descrizione breve"
        name: "descrizione_breve"
        widget: "text"
        hint: "Visibile nella griglia luoghi"
      - label: "Descrizione completa"
        name: "descrizione"
        widget: "markdown"
        hint: "Testo completo della pagina dedicata al luogo"
      - label: "Orari di apertura"
        name: "orari"
        widget: "string"
      - label: "Prezzo intero"
        name: "prezzo"
        widget: "string"
        hint: "Es: € 3,00 — oppure: Gratuito"
      - label: "Prezzo ridotto"
        name: "prezzo_ridotto"
        widget: "string"
        required: false
        hint: "Es: € 1,50"
      - label: "Indirizzo"
        name: "indirizzo"
        widget: "string"
      - label: "Latitudine GPS"
        name: "lat"
        widget: "string"
        hint: "Es: 36.92573"
      - label: "Longitudine GPS"
        name: "lng"
        widget: "string"
        hint: "Es: 14.74493"
      - label: "Widget Regiondo (uno o più)"
        name: "widgets_regiondo"
        widget: "list"
        required: false
        hint: "Aggiungi uno o più widget Regiondo per questo luogo"
        fields:
          - label: "Etichetta (es: Biglietto intero)"
            name: "etichetta"
            widget: "string"
            required: false
          - label: "Widget ID (UUID)"
            name: "id"
            widget: "string"
            hint: "Es: 991f34e0-1d51-4770-a87a-fed912d81c7d"
      - label: "Colore principale"
        name: "colore_principale"
        widget: "color"
        hint: "Colore hero e badge di questo luogo"
      - label: "Colore secondario"
        name: "colore_secondario"
        widget: "color"
        hint: "Colore overlay e accenti"
      - label: "Immagine hero (banner grande in cima)"
        name: "immagine"
        widget: "image"
        required: false
        hint: "Immagine usata come sfondo del banner in cima alla pagina luogo"
      - label: "Immagine nella descrizione (opzionale)"
        name: "immagine_corpo"
        widget: "image"
        required: false
        hint: "Foto aggiuntiva mostrata nel testo descrittivo"

  # ── TESTI SITO — HOME ──────────────────────────────────────
  - name: "sito_home"
    label: "🏠 Home — Testi"
    label_singular: "Home"
    folder: "_sito"
    filter: { field: "_file", value: "home" }
    create: false
    extension: "json"
    format: "json"
    files:
      - label: "Home — Testi hero e card"
        name: "home"
        file: "_sito/home.json"
        fields:
          - label: "Sovratitolo hero"
            name: "hero_sovratitolo"
            widget: "string"
          - label: "Titolo hero (grande)"
            name: "hero_titolo"
            widget: "string"
          - label: "Sottotitolo hero"
            name: "hero_sottotitolo"
            widget: "string"
          - label: "Testo hero"
            name: "hero_testo"
            widget: "text"
          - label: "Testo pulsante 1"
            name: "hero_btn1_testo"
            widget: "string"
          - label: "Testo pulsante 2"
            name: "hero_btn2_testo"
            widget: "string"
          - label: "Card 1 — Titolo"
            name: "card1_titolo"
            widget: "string"
          - label: "Card 1 — Testo"
            name: "card1_testo"
            widget: "text"
          - label: "Card 2 — Titolo"
            name: "card2_titolo"
            widget: "string"
          - label: "Card 2 — Testo"
            name: "card2_testo"
            widget: "text"
          - label: "Card 3 — Titolo"
            name: "card3_titolo"
            widget: "string"
          - label: "Card 3 — Testo"
            name: "card3_testo"
            widget: "text"

  # ── TESTI SITO — CHI SIAMO ─────────────────────────────────
  - name: "sito_chisiamo"
    label: "👥 Chi siamo — Testi"
    files:
      - label: "Chi siamo"
        name: "chi-siamo"
        file: "_sito/chi-siamo.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Testo principale"
            name: "testo"
            widget: "markdown"
          - label: "Partner 1 — Nome"
            name: "partner1_nome"
            widget: "string"
          - label: "Partner 1 — Ruolo"
            name: "partner1_ruolo"
            widget: "string"
          - label: "Partner 1 — URL"
            name: "partner1_url"
            widget: "string"
          - label: "Partner 2 — Nome"
            name: "partner2_nome"
            widget: "string"
          - label: "Partner 2 — Ruolo"
            name: "partner2_ruolo"
            widget: "string"
          - label: "Partner 2 — URL"
            name: "partner2_url"
            widget: "string"
          - label: "Partner 3 — Nome"
            name: "partner3_nome"
            widget: "string"
          - label: "Partner 3 — Ruolo"
            name: "partner3_ruolo"
            widget: "string"
          - label: "Partner 3 — URL"
            name: "partner3_url"
            widget: "string"

  # ── TESTI SITO — CONTATTI ──────────────────────────────────
  - name: "sito_contatti"
    label: "📬 Contatti — Testi"
    files:
      - label: "Contatti"
        name: "contatti"
        file: "_sito/contatti.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Sottotitolo"
            name: "sottotitolo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Telefono"
            name: "telefono"
            widget: "string"
            required: false
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Orari ufficio"
            name: "orari_ufficio"
            widget: "string"
            required: false

  # ── FOOTER ─────────────────────────────────────────────────
  - name: "sito_footer"
    label: "🔻 Footer"
    files:
      - label: "Footer"
        name: "footer"
        file: "_sito/footer.json"
        fields:
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Copyright"
            name: "copyright"
            widget: "string"

  # ── VITRUVIO CARD ──────────────────────────────────────────
  - name: "sito_vitruvio"
    label: "🎴 Vitruvio Card — Testi"
    files:
      - label: "Vitruvio Card"
        name: "vitruvio-card"
        file: "_sito/vitruvio-card.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Testo introduttivo"
            name: "testo_intro"
            widget: "text"
          - label: "Card 1 — Nome"
            name: "card1_nome"
            widget: "string"
          - label: "Card 1 — Testo"
            name: "card1_testo"
            widget: "text"
          - label: "Card 1 — Widget ID Regiondo"
            name: "card1_widget"
            widget: "string"
            required: false
          - label: "Card 2 — Nome"
            name: "card2_nome"
            widget: "string"
          - label: "Card 2 — Testo"
            name: "card2_testo"
            widget: "text"
          - label: "Card 2 — Widget ID Regiondo"
            name: "card2_widget"
            widget: "string"
            required: false
          - label: "Card 3 — Nome"
            name: "card3_nome"
            widget: "string"
          - label: "Card 3 — Testo"
            name: "card3_testo"
            widget: "text"
          - label: "Card 3 — Widget ID Regiondo"
            name: "card3_widget"
            widget: "string"
            required: false

  # ── CONTATTI ───────────────────────────────────────────────
  - name: "sito_contatti2"
    label: "📬 Contatti — Dettagli"
    files:
      - label: "Contatti"
        name: "contatti"
        file: "_sito/contatti.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Sito web"
            name: "sito"
            widget: "string"
            required: false
          - label: "Link Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Link Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "Come raggiungerci"
            name: "come_arrivare"
            widget: "text"
            hint: "Usa \\n per andare a capo"

  # ── PARTNER / SPONSOR ──────────────────────────────────────
  - name: "sito_partner"
    label: "🤝 Partner & Sponsor"
    files:
      - label: "Partner"
        name: "partner"
        file: "_sito/partner.json"
        fields:
          - label: "Partner"
            name: "partner"
            widget: "list"
            hint: "Aggiungi tutti i partner che appaiono in fondo a ogni pagina"
            fields:
              - label: "Nome"
                name: "nome"
                widget: "string"
              - label: "URL sito web"
                name: "url"
                widget: "string"
                required: false
                hint: "Es: https://www.diocesidiragusa.it"
              - label: "Logo"
                name: "logo"
                widget: "image"
                hint: "Logo in formato PNG o SVG"
              - label: "Mantieni colori originali logo"
                name: "colori_originali"
                widget: "boolean"
                default: true
                hint: "Se attivo, il logo appare a colori; se disattivo, diventa bianco"

  # ── TICKER ULTIMA ORA ──────────────────────────────────────
  - name: "sito_ticker"
    label: "📢 Ultima ora — Ticker"
    files:
      - label: "Ticker"
        name: "ticker"
        file: "_sito/ticker.json"
        fields:
          - label: "Testi fissi del ticker"
            name: "testi"
            widget: "list"
            hint: "Testi sempre visibili nel ticker (in aggiunta alle notizie automatiche)"
            field:
              label: "Testo"
              name: "testo"
              widget: "string"
              hint: "Es: P.A.S.T. — Patrimonio Arte Storia Territorio · Ragusa Ibla"

  # ── SEO ────────────────────────────────────────────────────
  - name: "sito_seo"
    label: "🔍 SEO — Titoli e descrizioni"
    files:
      - label: "SEO"
        name: "seo"
        file: "_sito/seo.json"
        fields:
          - label: "Home — Titolo pagina"
            name: "home_titolo"
            widget: "string"
            hint: "Es: P.A.S.T. — Patrimonio Arte Storia Territorio"
          - label: "Home — Descrizione"
            name: "home_descrizione"
            widget: "text"
            hint: "Testo che appare su Google (max 160 caratteri)"
          - label: "Eventi — Titolo pagina"
            name: "eventi_titolo"
            widget: "string"
          - label: "Eventi — Descrizione"
            name: "eventi_descrizione"
            widget: "text"
          - label: "Luoghi — Titolo pagina"
            name: "luoghi_titolo"
            widget: "string"
          - label: "Luoghi — Descrizione"
            name: "luoghi_descrizione"
            widget: "text"
          - label: "Notizie — Titolo pagina"
            name: "notizie_titolo"
            widget: "string"
          - label: "Notizie — Descrizione"
            name: "notizie_descrizione"
            widget: "text"
          - label: "Contatti — Titolo pagina"
            name: "contatti_titolo"
            widget: "string"
          - label: "Contatti — Descrizione"
            name: "contatti_descrizione"
            widget: "text"

  # ── VERSIONE INGLESE ───────────────────────────────────────
  - name: "sito_en"
    label: "🇬🇧 Versione inglese"
    files:
      - label: "Home EN"
        name: "home_en"
        file: "_sito/en-home.json"
        fields:
          - label: "Hero — Titolo"
            name: "hero_titolo"
            widget: "string"
          - label: "Hero — Sottotitolo"
            name: "hero_sottotitolo"
            widget: "string"
          - label: "Hero — Testo"
            name: "hero_testo"
            widget: "text"
          - label: "Pulsante 1"
            name: "btn1_testo"
            widget: "string"
          - label: "Pulsante 2"
            name: "btn2_testo"
            widget: "string"
          - label: "Card 1 — Titolo"
            name: "card1_titolo"
            widget: "string"
          - label: "Card 1 — Testo"
            name: "card1_testo"
            widget: "text"
          - label: "Card 2 — Titolo"
            name: "card2_titolo"
            widget: "string"
          - label: "Card 2 — Testo"
            name: "card2_testo"
            widget: "text"
          - label: "Card 3 — Titolo"
            name: "card3_titolo"
            widget: "string"
          - label: "Card 3 — Testo"
            name: "card3_testo"
            widget: "text"
      - label: "Chi siamo EN"
        name: "about_en"
        file: "_sito/en-about.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Testo principale"
            name: "testo"
            widget: "markdown"
      - label: "Contatti EN"
        name: "contatti_en"
        file: "_sito/en-contatti.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Sottotitolo"
            name: "sottotitolo"
            widget: "string"

  # ── IMPOSTAZIONI GENERALI ──────────────────────────────────
  - name: "sito_generale"
    label: "⚙️ Impostazioni generali"
    files:
      - label: "Generale"
        name: "generale"
        file: "_sito/generale.json"
        fields:
          - label: "Nome del sito"
            name: "nome_sito"
            widget: "string"
            hint: "Es: P.A.S.T."
          - label: "Slogan / tagline"
            name: "tagline"
            widget: "string"
            hint: "Es: Patrimonio Arte Storia Territorio"
          - label: "Email principale"
            name: "email"
            widget: "string"
          - label: "Telefono"
            name: "telefono"
            widget: "string"
            required: false
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Link Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "Link Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Mostra versione inglese"
            name: "mostra_en"
            widget: "boolean"
            default: true
            hint: "Se disattivo, nasconde il pulsante EN dalla navbar"

  # ── PAGINE INGLESE (creabili dal CMS) ──────────────────────
  - name: "pagine_en"
    label: "🇬🇧 Pagine in inglese"
    label_singular: "Pagina EN"
    folder: "_en"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Slug (identificatore URL)"
        name: "slug"
        widget: "string"
        hint: "Usa solo lettere minuscole e trattini — es: chi-siamo. La pagina sarà accessibile su /en/chi-siamo"
      - label: "Titolo pagina (EN)"
        name: "titolo"
        widget: "string"
        hint: "Titolo che appare nel browser e nell'intestazione"
      - label: "Sottotitolo / tag"
        name: "tag"
        widget: "string"
        required: false
        hint: "Piccola etichetta sopra il titolo"
      - label: "Contenuto (EN)"
        name: "contenuto"
        widget: "markdown"
        hint: "Testo principale della pagina in inglese"
      - label: "Immagine hero (opzionale)"
        name: "immagine_hero"
        widget: "image"
        required: false
        hint: "Immagine di sfondo del banner"
      - label: "Pagina italiana corrispondente"
        name: "it_url"
        widget: "string"
        required: false
        hint: "Es: chi-siamo.html — per il bottone IT/EN"
