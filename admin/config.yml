# ============================================================
# P.A.S.T. — Configurazione Decap CMS
# ============================================================

backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "it"

collections:

  # ── EVENTI ─────────────────────────────────────────────────
  - name: "eventi"
    label: "📅 Eventi"
    label_singular: "Evento"
    folder: "_eventi"
    create: true
    slug: "{{fields.titolo}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Titolo evento"
        name: "titolo"
        widget: "string"
        hint: "Es: Apertura straordinaria Duomo San Giorgio"
      - label: "Sottotitolo"
        name: "sottotitolo"
        widget: "string"
        hint: "Es: Ore 20:00 · Duomo San Giorgio"
      - label: "Giorno"
        name: "giorno"
        widget: "string"
        hint: "Solo il numero del giorno — es: 23"
      - label: "Mese"
        name: "mese"
        widget: "string"
        hint: "Abbreviazione 3 lettere — es: Apr, Mag, Giu"
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Inaugurazione", value: "inaugurazione" }
          - { label: "Apertura serale", value: "apertura" }
          - { label: "Proiezione", value: "proiezione" }
          - { label: "Incontro / Conferenza", value: "incontro" }
          - { label: "Workshop", value: "workshop" }
          - { label: "Altro", value: "altro" }
      - label: "Testo anteprima"
        name: "anteprima"
        widget: "text"
        hint: "Breve descrizione visibile nella griglia eventi"
      - label: "Descrizione completa"
        name: "descrizione"
        widget: "markdown"
      - label: "Luogo"
        name: "luogo"
        widget: "string"
      - label: "Orario"
        name: "orario"
        widget: "string"
        hint: "Es: 20:00 – 23:00"
      - label: "Data completa"
        name: "data_completa"
        widget: "string"
        hint: "Es: 24 Aprile 2025"
      - label: "Prezzo / Ingresso"
        name: "prezzo"
        widget: "string"
        hint: "Es: € 5,00 — oppure: Ingresso libero"
      - label: "Sottotitolo prezzo"
        name: "sub_prezzo"
        widget: "string"
        required: false
      - label: "Tipo prenotazione"
        name: "tipo_prenotazione"
        widget: "select"
        options:
          - { label: "Eventbrite", value: "eventbrite" }
          - { label: "Regiondo", value: "regiondo" }
          - { label: "Ingresso libero (nessuna prenotazione)", value: "free" }
      - label: "Link prenotazione"
        name: "link_prenotazione"
        widget: "string"
        required: false
      - label: "Badge 1"
        name: "badge1"
        widget: "select"
        required: false
        options:
          - { label: "Inaugurazione", value: "badge-mostra" }
          - { label: "Workshop", value: "badge-workshop" }
          - { label: "Spettacolo", value: "badge-spettacolo" }
          - { label: "Incontro", value: "badge-incontro" }
          - { label: "Ingresso libero", value: "badge-gratuito" }
      - label: "Badge 2 (opzionale)"
        name: "badge2"
        widget: "select"
        required: false
        options:
          - { label: "Nessuno", value: "" }
          - { label: "Ingresso libero", value: "badge-gratuito" }
          - { label: "Workshop", value: "badge-workshop" }
      - label: "Immagine di sfondo hero"
        name: "immagine"
        widget: "image"
        required: false

  # ── NOTIZIE ────────────────────────────────────────────────
  - name: "notizie"
    label: "📰 Notizie"
    label_singular: "Notizia"
    folder: "_notizie"
    create: true
    slug: "{{fields.titolo}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Titolo notizia"
        name: "titolo"
        widget: "string"
      - label: "Testo anteprima"
        name: "anteprima"
        widget: "text"
      - label: "Contenuto completo"
        name: "contenuto"
        widget: "markdown"
      - label: "Data pubblicazione"
        name: "data"
        widget: "string"
        hint: "Es: 20 marzo 2025"
      - label: "Categoria"
        name: "badge_testo"
        widget: "select"
        options:
          - { label: "Annuncio", value: "Annuncio" }
          - { label: "Evento", value: "Evento" }
          - { label: "Luogo", value: "Luogo" }
          - { label: "Associazione", value: "Associazione" }

  # ── LUOGHI ─────────────────────────────────────────────────
  - name: "luoghi"
    label: "📍 Luoghi"
    label_singular: "Luogo"
    folder: "_luoghi"
    create: false
    extension: "json"
    format: "json"
    fields:
      - label: "Nome del luogo"
        name: "titolo"
        widget: "string"
      - label: "Slug (non modificare)"
        name: "slug"
        widget: "string"
        hint: "Identificatore URL — es: san-giorgio"
      - label: "Categoria principale"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Museo", value: "Musei" }
          - { label: "Chiesa", value: "Chiese" }
          - { label: "Unicità", value: "Unicità" }
      - label: "Tag secondario (opzionale)"
        name: "tag_extra"
        widget: "string"
        required: false
        hint: "Es: Chiese — appare come secondo badge"
      - label: "Descrizione breve"
        name: "descrizione_breve"
        widget: "text"
        hint: "Visibile nella griglia luoghi"
      - label: "Descrizione completa"
        name: "descrizione"
        widget: "markdown"
        hint: "Testo completo della pagina dedicata al luogo"
      - label: "Orari di apertura"
        name: "orari"
        widget: "string"
      - label: "Prezzo intero"
        name: "prezzo"
        widget: "string"
        hint: "Es: € 3,00 — oppure: Gratuito"
      - label: "Prezzo ridotto"
        name: "prezzo_ridotto"
        widget: "string"
        required: false
        hint: "Es: € 1,50"
      - label: "Indirizzo"
        name: "indirizzo"
        widget: "string"
      - label: "Latitudine GPS"
        name: "lat"
        widget: "string"
        hint: "Es: 36.92573"
      - label: "Longitudine GPS"
        name: "lng"
        widget: "string"
        hint: "Es: 14.74493"
      - label: "Link prenotazione Regiondo"
        name: "link_regiondo"
        widget: "string"
        required: false
      - label: "Colore principale"
        name: "colore_principale"
        widget: "color"
        hint: "Colore hero e badge di questo luogo"
      - label: "Colore secondario"
        name: "colore_secondario"
        widget: "color"
        hint: "Colore overlay e accenti"
      - label: "Immagine di sfondo"
        name: "immagine"
        widget: "image"
        required: false
        hint: "Immagine hero della pagina luogo"

  # ── TESTI SITO — HOME ──────────────────────────────────────
  - name: "sito_home"
    label: "🏠 Home — Testi"
    label_singular: "Home"
    folder: "_sito"
    filter: { field: "_file", value: "home" }
    create: false
    extension: "json"
    format: "json"
    files:
      - label: "Home — Testi hero e card"
        name: "home"
        file: "_sito/home.json"
        fields:
          - label: "Sovratitolo hero"
            name: "hero_sovratitolo"
            widget: "string"
          - label: "Titolo hero (grande)"
            name: "hero_titolo"
            widget: "string"
          - label: "Sottotitolo hero"
            name: "hero_sottotitolo"
            widget: "string"
          - label: "Testo hero"
            name: "hero_testo"
            widget: "text"
          - label: "Testo pulsante 1"
            name: "hero_btn1_testo"
            widget: "string"
          - label: "Testo pulsante 2"
            name: "hero_btn2_testo"
            widget: "string"
          - label: "Card 1 — Titolo"
            name: "card1_titolo"
            widget: "string"
          - label: "Card 1 — Testo"
            name: "card1_testo"
            widget: "text"
          - label: "Card 2 — Titolo"
            name: "card2_titolo"
            widget: "string"
          - label: "Card 2 — Testo"
            name: "card2_testo"
            widget: "text"
          - label: "Card 3 — Titolo"
            name: "card3_titolo"
            widget: "string"
          - label: "Card 3 — Testo"
            name: "card3_testo"
            widget: "text"

  # ── TESTI SITO — CHI SIAMO ─────────────────────────────────
  - name: "sito_chisiamo"
    label: "👥 Chi siamo — Testi"
    files:
      - label: "Chi siamo"
        name: "chi-siamo"
        file: "_sito/chi-siamo.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Testo principale"
            name: "testo"
            widget: "markdown"
          - label: "Partner 1 — Nome"
            name: "partner1_nome"
            widget: "string"
          - label: "Partner 1 — Ruolo"
            name: "partner1_ruolo"
            widget: "string"
          - label: "Partner 1 — URL"
            name: "partner1_url"
            widget: "string"
          - label: "Partner 2 — Nome"
            name: "partner2_nome"
            widget: "string"
          - label: "Partner 2 — Ruolo"
            name: "partner2_ruolo"
            widget: "string"
          - label: "Partner 2 — URL"
            name: "partner2_url"
            widget: "string"
          - label: "Partner 3 — Nome"
            name: "partner3_nome"
            widget: "string"
          - label: "Partner 3 — Ruolo"
            name: "partner3_ruolo"
            widget: "string"
          - label: "Partner 3 — URL"
            name: "partner3_url"
            widget: "string"

  # ── TESTI SITO — CONTATTI ──────────────────────────────────
  - name: "sito_contatti"
    label: "📬 Contatti — Testi"
    files:
      - label: "Contatti"
        name: "contatti"
        file: "_sito/contatti.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Sottotitolo"
            name: "sottotitolo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Telefono"
            name: "telefono"
            widget: "string"
            required: false
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Orari ufficio"
            name: "orari_ufficio"
            widget: "string"
            required: false

  # ── FOOTER ─────────────────────────────────────────────────
  - name: "sito_footer"
    label: "🔻 Footer"
    files:
      - label: "Footer"
        name: "footer"
        file: "_sito/footer.json"
        fields:
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Copyright"
            name: "copyright"
            widget: "string"

  # ── VITRUVIO CARD ──────────────────────────────────────────
  - name: "sito_vitruvio"
    label: "🎴 Vitruvio Card — Testi"
    files:
      - label: "Vitruvio Card"
        name: "vitruvio-card"
        file: "_sito/vitruvio-card.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Testo introduttivo"
            name: "testo_intro"
            widget: "text"
          - label: "Card 1 — Nome"
            name: "card1_nome"
            widget: "string"
          - label: "Card 1 — Testo"
            name: "card1_testo"
            widget: "text"
          - label: "Card 1 — Widget ID Regiondo"
            name: "card1_widget"
            widget: "string"
            required: false
          - label: "Card 2 — Nome"
            name: "card2_nome"
            widget: "string"
          - label: "Card 2 — Testo"
            name: "card2_testo"
            widget: "text"
          - label: "Card 2 — Widget ID Regiondo"
            name: "card2_widget"
            widget: "string"
            required: false
          - label: "Card 3 — Nome"
            name: "card3_nome"
            widget: "string"
          - label: "Card 3 — Testo"
            name: "card3_testo"
            widget: "text"
          - label: "Card 3 — Widget ID Regiondo"
            name: "card3_widget"
            widget: "string"
            required: false

  # ── CONTATTI ───────────────────────────────────────────────
  - name: "sito_contatti2"
    label: "📬 Contatti — Dettagli"
    files:
      - label: "Contatti"
        name: "contatti"
        file: "_sito/contatti.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Sito web"
            name: "sito"
            widget: "string"
            required: false
          - label: "Link Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Link Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "Come raggiungerci"
            name: "come_arrivare"
            widget: "text"
            hint: "Usa \\n per andare a capo"
