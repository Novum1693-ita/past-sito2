# ============================================================
# P.A.S.T. — Configurazione Decap CMS
# ============================================================

backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "it"

collections:

  # ── EVENTI ─────────────────────────────────────────────────
  - name: "eventi"
    label: "📅 Eventi"
    label_singular: "Evento"
    folder: "_eventi"
    create: true
    slug: "{{fields.titolo}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Titolo evento"
        name: "titolo"
        widget: "string"
        hint: "Es: Apertura straordinaria Duomo San Giorgio"
      - label: "Sottotitolo"
        name: "sottotitolo"
        widget: "string"
        hint: "Es: Ore 20:00 · Duomo San Giorgio"
      - label: "Giorno"
        name: "giorno"
        widget: "string"
        hint: "Solo il numero del giorno — es: 23"
      - label: "Mese"
        name: "mese"
        widget: "string"
        hint: "Abbreviazione 3 lettere — es: Apr, Mag, Giu"
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Inaugurazione", value: "inaugurazione" }
          - { label: "Apertura serale", value: "apertura" }
          - { label: "Proiezione", value: "proiezione" }
          - { label: "Incontro / Conferenza", value: "incontro" }
          - { label: "Workshop", value: "workshop" }
          - { label: "Altro", value: "altro" }
      - label: "Testo anteprima"
        name: "anteprima"
        widget: "text"
        hint: "Breve descrizione visibile nella griglia eventi"
      - label: "Descrizione completa"
        name: "descrizione"
        widget: "markdown"
      - label: "Luogo"
        name: "luogo"
        widget: "string"
      - label: "Orario"
        name: "orario"
        widget: "string"
        hint: "Es: 20:00 – 23:00"
      - label: "Data completa"
        name: "data_completa"
        widget: "string"
        hint: "Es: 24 Aprile 2025"
      - label: "Tariffe"
        name: "tariffe"
        widget: "list"
        required: false
        hint: "Aggiungi una riga per ogni tariffa (es: Intero → € 5, Ridotto → € 3, Gratuito → € 0)"
        fields:
          - label: "Etichetta"
            name: "etichetta"
            widget: "string"
            hint: "Es: Intero, Ridotto studenti, Gratuito under 6"
          - label: "Prezzo"
            name: "prezzo"
            widget: "string"
            hint: "Es: € 5,00 — oppure: Gratuito"
      - label: "Tipo prenotazione"
        name: "tipo_prenotazione"
        widget: "select"
        options:
          - { label: "Eventbrite", value: "eventbrite" }
          - { label: "Regiondo", value: "regiondo" }
          - { label: "Ingresso libero (nessuna prenotazione)", value: "free" }
      - label: "Link prenotazione (Eventbrite)"
        name: "link_prenotazione"
        widget: "string"
        required: false
      - label: "Widget Regiondo (uno o più)"
        name: "widgets_regiondo"
        widget: "list"
        required: false
        hint: "Aggiungi uno o più widget Regiondo per questo evento"
        fields:
          - label: "Etichetta (es: Biglietto intero)"
            name: "etichetta"
            widget: "string"
            required: false
          - label: "Widget ID (UUID)"
            name: "id"
            widget: "string"
            hint: "Es: cc29ea83-e3f8-48be-9edb-47d86097e8d8"
      - label: "Badge 1"
        name: "badge1"
        widget: "select"
        required: false
        options:
          - { label: "Inaugurazione", value: "badge-mostra" }
          - { label: "Workshop", value: "badge-workshop" }
          - { label: "Spettacolo", value: "badge-spettacolo" }
          - { label: "Incontro", value: "badge-incontro" }
          - { label: "Ingresso libero", value: "badge-gratuito" }
      - label: "Badge 2 (opzionale)"
        name: "badge2"
        widget: "select"
        required: false
        options:
          - { label: "Nessuno", value: "" }
          - { label: "Ingresso libero", value: "badge-gratuito" }
          - { label: "Workshop", value: "badge-workshop" }
      - label: "Immagine hero (banner grande in cima)"
        name: "immagine_hero"
        widget: "image"
        required: false
        hint: "Foto usata come sfondo del banner in cima alla pagina evento"
      - label: "Immagine nel corpo (locandina / foto)"
        name: "immagine_corpo"
        widget: "image"
        required: false
        hint: "Foto o locandina mostrata nel testo descrittivo"
      - label: "URL pagina evento (generato automaticamente)"
        name: "url"
        widget: "string"
        required: false
        hint: "Lascia vuoto — viene generato dalla Netlify Function"
      - label: "✅ Pubblicato (visibile sul sito)"
        name: "pubblicato"
        widget: "boolean"
        default: true
        hint: "Se disattivo, l'evento è salvato come bozza e non appare sul sito"
      - label: "Note interne (solo admin)"
        name: "note_interne"
        widget: "text"
        required: false
        hint: "Visibile solo nell'admin — non appare mai sul sito"
      - label: "Titolo evento (EN)"
        name: "titolo_en"
        widget: "string"
        required: false
        hint: "Titolo in inglese — lascia vuoto per mostrare quello italiano anche in EN"
      - label: "Testo anteprima (EN)"
        name: "anteprima_en"
        widget: "text"
        required: false
      - label: "Descrizione completa (EN)"
        name: "descrizione_en"
        widget: "markdown"
        required: false

  # ── NOTIZIE ────────────────────────────────────────────────
  - name: "notizie"
    label: "📰 Notizie"
    label_singular: "Notizia"
    folder: "_notizie"
    create: true
    slug: "{{fields.titolo}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Titolo notizia"
        name: "titolo"
        widget: "string"
      - label: "Testo anteprima"
        name: "anteprima"
        widget: "text"
      - label: "Contenuto completo"
        name: "contenuto"
        widget: "markdown"
      - label: "Data pubblicazione"
        name: "data"
        widget: "string"
        hint: "Es: 20 marzo 2025"
      - label: "Categoria"
        name: "badge_testo"
        widget: "select"
        options:
          - { label: "Annuncio", value: "Annuncio" }
          - { label: "Evento", value: "Evento" }
          - { label: "Luogo", value: "Luogo" }
          - { label: "Associazione", value: "Associazione" }
      - label: "✅ Pubblicata (visibile sul sito)"
        name: "pubblicata"
        widget: "boolean"
        default: true
        hint: "Se disattivo, la notizia è salvata come bozza"
      - label: "Titolo notizia (EN)"
        name: "titolo_en"
        widget: "string"
        required: false
      - label: "Testo anteprima (EN)"
        name: "anteprima_en"
        widget: "text"
        required: false
      - label: "Contenuto completo (EN)"
        name: "contenuto_en"
        widget: "markdown"
        required: false

  # ── LUOGHI ─────────────────────────────────────────────────
  - name: "luoghi"
    label: "📍 Luoghi"
    label_singular: "Luogo"
    folder: "_luoghi"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    fields:
      - label: "Nome del luogo"
        name: "titolo"
        widget: "string"
      - label: "Slug (identificatore URL)"
        name: "slug"
        widget: "string"
        hint: "Usa solo lettere minuscole e trattini — es: san-giovanni. Determina l'URL della pagina."
      - label: "Categoria principale"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Chiese", value: "Chiese" }
          - { label: "Musei", value: "Musei" }
          - { label: "Palazzi", value: "Palazzi" }
          - { label: "Siti Archeologici", value: "Siti Archeologici" }
          - { label: "Campanili", value: "Campanili" }
          - { label: "Unicità", value: "Unicità" }
          - { label: "Altro", value: "Altro" }
        hint: "Determina il filtro sulla pagina I Luoghi"
      - label: "Tag secondario (opzionale)"
        name: "tag_extra"
        widget: "string"
        required: false
        hint: "Es: Chiese — appare come secondo badge"
      - label: "Descrizione breve"
        name: "descrizione_breve"
        widget: "text"
        hint: "Visibile nella griglia luoghi"
      - label: "Descrizione completa"
        name: "descrizione"
        widget: "markdown"
        hint: "Testo completo della pagina dedicata al luogo"
      - label: "Orari di apertura"
        name: "orari"
        widget: "string"
      - label: "Tariffe"
        name: "tariffe"
        widget: "list"
        required: false
        hint: "Aggiungi una riga per ogni tariffa (es: Intero → € 3, Ridotto → € 1,50, Gratuito → € 0)"
        fields:
          - label: "Etichetta"
            name: "etichetta"
            widget: "string"
            hint: "Es: Intero, Ridotto studenti, Gratuito under 6"
          - label: "Prezzo"
            name: "prezzo"
            widget: "string"
            hint: "Es: € 3,00 — oppure: Gratuito"
      - label: "Indirizzo"
        name: "indirizzo"
        widget: "string"
      - label: "Latitudine GPS"
        name: "lat"
        widget: "string"
        hint: "Es: 36.92573"
      - label: "Longitudine GPS"
        name: "lng"
        widget: "string"
        hint: "Es: 14.74493"
      - label: "Widget Regiondo (uno o più)"
        name: "widgets_regiondo"
        widget: "list"
        required: false
        hint: "Aggiungi uno o più widget Regiondo per questo luogo"
        fields:
          - label: "Etichetta (es: Biglietto intero)"
            name: "etichetta"
            widget: "string"
            required: false
          - label: "Widget ID (UUID)"
            name: "id"
            widget: "string"
            hint: "Es: 991f34e0-1d51-4770-a87a-fed912d81c7d"
      - label: "Colore principale"
        name: "colore_principale"
        widget: "color"
        hint: "Colore hero e badge di questo luogo"
      - label: "Colore secondario"
        name: "colore_secondario"
        widget: "color"
        hint: "Colore overlay e accenti"
      - label: "Immagine hero (banner grande in cima)"
        name: "immagine"
        widget: "image"
        required: false
        hint: "Immagine usata come sfondo del banner in cima alla pagina luogo"
      - label: "Immagine nella descrizione (opzionale)"
        name: "immagine_corpo"
        widget: "image"
        required: false
        hint: "Foto aggiuntiva mostrata nel testo descrittivo"
      - label: "✅ Pubblicato (visibile sul sito)"
        name: "pubblicato"
        widget: "boolean"
        default: true
        hint: "Se disattivo, il luogo è salvato come bozza e non appare sul sito"
      - label: "Note interne (solo admin)"
        name: "note_interne"
        widget: "text"
        required: false
        hint: "Visibile solo nell'admin — non appare mai sul sito"
      - label: "Durata visita consigliata"
        name: "durata_visita"
        widget: "select"
        required: false
        options:
          - { label: "15 minuti", value: "15 min" }
          - { label: "30 minuti", value: "30 min" }
          - { label: "1 ora", value: "1 ora" }
          - { label: "2 ore", value: "2 ore" }
          - { label: "Mezza giornata", value: "Mezza giornata" }
      - label: "♿ Accessibile in sedia a rotelle"
        name: "accessibile_sedia"
        widget: "boolean"
        default: false
      - label: "♿ Bagno accessibile"
        name: "accessibile_bagno"
        widget: "boolean"
        default: false
      - label: "🎧 Audioguida disponibile"
        name: "audioguida"
        widget: "boolean"
        default: false
      - label: "🤟 Lingua dei segni su richiesta"
        name: "lingua_segni"
        widget: "boolean"
        default: false
      - label: "Note accessibilità"
        name: "note_accessibilita"
        widget: "string"
        required: false
        hint: "Es: Rampa laterale, suonare il campanello"
      - label: "Come arrivare / Parcheggio"
        name: "come_arrivare"
        widget: "text"
        required: false
        hint: "Indicazioni per raggiungere il luogo e dove parcheggiare"
      - label: "Telefono diretto"
        name: "telefono"
        widget: "string"
        required: false
      - label: "Email diretta"
        name: "email"
        widget: "string"
        required: false
      - label: "Sito web ufficiale"
        name: "sito_web"
        widget: "string"
        required: false
        hint: "Es: https://www.diocesidiragusa.it"
      - label: "Nome luogo (EN)"
        name: "titolo_en"
        widget: "string"
        required: false
        hint: "Lascia vuoto per usare il nome italiano anche in EN"
      - label: "Descrizione breve (EN)"
        name: "descrizione_breve_en"
        widget: "text"
        required: false
      - label: "Descrizione completa (EN)"
        name: "descrizione_en"
        widget: "markdown"
        required: false
      - label: "Orari di apertura (EN)"
        name: "orari_en"
        widget: "string"
        required: false
      - label: "Come arrivare (EN)"
        name: "come_arrivare_en"
        widget: "text"
        required: false

  # ── TESTI SITO — HOME ──────────────────────────────────────
  - name: "sito_home"
    label: "🏠 Home — Testi e immagine"
    files:
      - label: "Home — Hero, card e immagine"
        name: "home"
        file: "_sito/home.json"
        fields:
          - label: "🖼️ Immagine di sfondo hero"
            name: "hero_immagine"
            widget: "image"
            required: false
            hint: "Lascia vuoto per usare lo sfondo predefinito del CSS"
          - label: "Sovratitolo hero"
            name: "hero_sovratitolo"
            widget: "string"
          - label: "Titolo hero (grande)"
            name: "hero_titolo"
            widget: "string"
          - label: "Sottotitolo hero"
            name: "hero_sottotitolo"
            widget: "string"
          - label: "Testo hero"
            name: "hero_testo"
            widget: "text"
          - label: "Testo pulsante 1"
            name: "hero_btn1_testo"
            widget: "string"
          - label: "Link pulsante 1"
            name: "hero_btn1_link"
            widget: "string"
            hint: "Es: eventi.html"
          - label: "Testo pulsante 2"
            name: "hero_btn2_testo"
            widget: "string"
          - label: "Link pulsante 2"
            name: "hero_btn2_link"
            widget: "string"
            hint: "Es: i-luoghi.html"
          - label: "Card 1 — Titolo"
            name: "card1_titolo"
            widget: "string"
          - label: "Card 1 — Testo"
            name: "card1_testo"
            widget: "text"
          - label: "Card 2 — Titolo"
            name: "card2_titolo"
            widget: "string"
          - label: "Card 2 — Testo"
            name: "card2_testo"
            widget: "text"
          - label: "Card 3 — Titolo"
            name: "card3_titolo"
            widget: "string"
          - label: "Card 3 — Testo"
            name: "card3_testo"
            widget: "text"

  # ── TESTI SITO — CHI SIAMO ─────────────────────────────────
  - name: "sito_chisiamo"
    label: "👥 Chi siamo — Testi"
    files:
      - label: "Chi siamo"
        name: "chi-siamo"
        file: "_sito/chi-siamo.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Testo principale"
            name: "testo"
            widget: "markdown"
          - label: "Partner 1 — Nome"
            name: "partner1_nome"
            widget: "string"
          - label: "Partner 1 — Ruolo"
            name: "partner1_ruolo"
            widget: "string"
          - label: "Partner 1 — URL"
            name: "partner1_url"
            widget: "string"
          - label: "Partner 2 — Nome"
            name: "partner2_nome"
            widget: "string"
          - label: "Partner 2 — Ruolo"
            name: "partner2_ruolo"
            widget: "string"
          - label: "Partner 2 — URL"
            name: "partner2_url"
            widget: "string"
          - label: "Partner 3 — Nome"
            name: "partner3_nome"
            widget: "string"
          - label: "Partner 3 — Ruolo"
            name: "partner3_ruolo"
            widget: "string"
          - label: "Partner 3 — URL"
            name: "partner3_url"
            widget: "string"

  # ── TESTI SITO — CONTATTI ──────────────────────────────────
  - name: "sito_contatti"
    label: "📬 Contatti — Testi"
    files:
      - label: "Contatti"
        name: "contatti"
        file: "_sito/contatti.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Sottotitolo"
            name: "sottotitolo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Telefono"
            name: "telefono"
            widget: "string"
            required: false
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Orari ufficio"
            name: "orari_ufficio"
            widget: "string"
            required: false

  # ── FOOTER ─────────────────────────────────────────────────
  - name: "sito_footer"
    label: "🔻 Footer"
    files:
      - label: "Footer"
        name: "footer"
        file: "_sito/footer.json"
        fields:
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Copyright"
            name: "copyright"
            widget: "string"

  # ── LE CARD ─────────────────────────────────────────────────
  - name: "sito_vitruvio"
    label: "🎴 Card — Testi"
    files:
      - label: "Card"
        name: "vitruvio-card"
        file: "_sito/vitruvio-card.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Titolo pagina (EN)"
            name: "titolo_en"
            widget: "string"
            required: false
          - label: "Testo introduttivo"
            name: "testo_intro"
            widget: "text"
          - label: "Testo introduttivo (EN)"
            name: "testo_intro_en"
            widget: "text"
            required: false
          - label: "Sezioni"
            name: "sezioni"
            widget: "list"
            hint: "Organizza le card in sezioni tematiche (es. Vitruvio Card, Card Speciali…)"
            fields:
              - label: "✅ Sezione pubblicata"
                name: "pubblicata"
                widget: "boolean"
                default: true
              - label: "Titolo sezione"
                name: "titolo_sezione"
                widget: "string"
                hint: "Es: Vitruvio Card"
              - label: "Titolo sezione (EN)"
                name: "titolo_sezione_en"
                widget: "string"
                required: false
              - label: "Descrizione sezione (opzionale)"
                name: "descrizione_sezione"
                widget: "text"
                required: false
              - label: "Descrizione sezione (EN)"
                name: "descrizione_sezione_en"
                widget: "text"
                required: false
              - label: "Card in questa sezione"
                name: "cards"
                widget: "list"
                hint: "Aggiungi, riordina e disattiva le card liberamente"
                fields:
                  - label: "✅ Pubblicata (visibile sul sito)"
                    name: "pubblicata"
                    widget: "boolean"
                    default: true
                  - label: "Nome card"
                    name: "nome"
                    widget: "string"
                    hint: "Es: Dorico Card"
                  - label: "Nome card (EN)"
                    name: "nome_en"
                    widget: "string"
                    required: false
                  - label: "Testo descrittivo"
                    name: "testo"
                    widget: "text"
                  - label: "Testo descrittivo (EN)"
                    name: "testo_en"
                    widget: "text"
                    required: false
                  - label: "Tariffe (opzionale)"
                    name: "tariffe"
                    widget: "list"
                    required: false
                    hint: "Aggiungi una riga per ogni tariffa (es: Intero → € 12, Ridotto → € 8)"
                    fields:
                      - label: "Etichetta"
                        name: "etichetta"
                        widget: "string"
                        hint: "Es: Intero, Ridotto studenti, Gratuito"
                      - label: "Prezzo"
                        name: "prezzo"
                        widget: "string"
                        hint: "Es: € 12,00 — oppure: Gratuito"
                  - label: "Widget ID Regiondo"
                    name: "widget_id"
                    widget: "string"
                    required: false
                    hint: "UUID del widget Regiondo per l'acquisto"
                  - label: "Immagine card (opzionale)"
                    name: "immagine"
                    widget: "image"
                    required: false

  # ── CONTATTI ───────────────────────────────────────────────
  - name: "sito_contatti2"
    label: "📬 Contatti — Dettagli"
    files:
      - label: "Contatti"
        name: "contatti"
        file: "_sito/contatti.json"
        fields:
          - label: "Titolo pagina"
            name: "titolo"
            widget: "string"
          - label: "Indirizzo"
            name: "indirizzo"
            widget: "string"
          - label: "Email"
            name: "email"
            widget: "string"
          - label: "Sito web"
            name: "sito"
            widget: "string"
            required: false
          - label: "Link Instagram"
            name: "instagram"
            widget: "string"
            required: false
          - label: "Link Facebook"
            name: "facebook"
            widget: "string"
            required: false
          - label: "Come raggiungerci"
            name: "come_arrivare"
            widget: "text"
            hint: "Usa \\n per andare a capo"

  # ── PARTNER / SPONSOR ──────────────────────────────────────
  - name: "sito_partner"
    label: "🤝 Partner & Sponsor"
    files:
      - label: "Partner"
        name: "partner"
        file: "_sito/partner.json"
        fields:
          - label: "Partner"
            name: "partner"
            widget: "list"
            hint: "Aggiungi tutti i partner che appaiono in fondo a ogni pagina"
            fields:
              - label: "Nome"
                name: "nome"
                widget: "string"
              - label: "URL sito web"
                name: "url"
                widget: "string"
                required: false
                hint: "Es: https://www.diocesidiragusa.it"
              - label: "Logo"
                name: "logo"
                widget: "image"
                hint: "Logo in formato PNG o SVG"
              - label: "Mantieni colori originali logo"
                name: "colori_originali"
                widget: "boolean"
                default: true
                hint: "Se attivo, il logo appare a colori; se disattivo, diventa bianco"

  # ── TICKER ULTIMA ORA ──────────────────────────────────────
  - name: "sito_ticker"
    label: "📢 Ultima ora — Ticker"
    files:
      - label: "Ticker"
        name: "ticker"
