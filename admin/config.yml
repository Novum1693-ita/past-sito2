            hint: "Testo descrittivo sopra il form di prenotazione"
          - label: "ID form Formspree"
            name: "formspree_id"
            widget: "string"
            required: false
            hint: "Inserisci qui l'ID del form Formspree (es: xabc1234)"
          - label: "Immagine sfondo (opzionale)"
            name: "immagine_sfondo"
            widget: "image"
            required: false

  # ── PERCORSI ────────────────────────────────────────────────
  - name: "percorsi"
    label: "🗺 Percorsi"
    label_singular: "Percorso"
    folder: "_percorsi"
    create: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "titolo"
    fields:
      - label: "Pubblicato"
        name: "pubblicato"
        widget: "boolean"
        default: true
        hint: "Deseleziona per mettere in bozza (non visibile sul sito)"
      - label: "Slug (URL)"
        name: "slug"
        widget: "string"
        hint: "Solo lettere minuscole e trattini, es: barocco-ibleo"
      - label: "Titolo"
        name: "titolo"
        widget: "string"
      - label: "Titolo (EN)"
        name: "titolo_en"
        widget: "string"
        required: false
      - label: "Sottotitolo"
        name: "sottotitolo"
        widget: "string"
        required: false
      - label: "Sottotitolo (EN)"
        name: "sottotitolo_en"
        widget: "string"
        required: false
      - label: "Descrizione"
        name: "descrizione"
        widget: "text"
      - label: "Descrizione (EN)"
        name: "descrizione_en"
        widget: "text"
        required: false
      - label: "Immagine copertina"
        name: "immagine"
        widget: "image"
        required: false
      - label: "Durata totale"
        name: "durata_totale"
        widget: "string"
        hint: "Es: 2 ore, 3 ore e mezza"
        required: false
      - label: "Difficoltà"
        name: "difficolta"
        widget: "select"
        options: ["Facile", "Media", "Impegnativa"]
        default: "Facile"
        required: false
      - label: "Lingue guida disponibili"
        name: "lingue_guida"
        widget: "select"
        multiple: true
        options:
          - { label: "Italiano", value: "it" }
          - { label: "English", value: "en" }
          - { label: "Français", value: "fr" }
          - { label: "Deutsch", value: "de" }
          - { label: "Español", value: "es" }
        required: false
      - label: "Tappe (slug dei luoghi, in ordine)"
        name: "luoghi"
        widget: "list"
        field:
          label: "Slug luogo"
          name: "slug"
          widget: "string"
          hint: "Inserisci lo slug del luogo, es: san-giorgio"
        hint: "Aggiungi i luoghi nell'ordine in cui si visitano"
      # ── Accessibilità ──
      - label: "♿ Accessibile in sedia a rotelle"
        name: "accessibile_sedia"
        widget: "boolean"
        default: false
        required: false
      - label: "🎧 Audioguida disponibile"
        name: "audioguida"
        widget: "boolean"
        default: false
        required: false
      - label: "🤟 Disponibile in LIS (Lingua dei Segni)"
        name: "lingua_segni"
        widget: "boolean"
        default: false
        required: false
      - label: "Note accessibilità"
        name: "note_accessibilita"
        widget: "string"
        required: false
        hint: "Es: Alcuni tratti in salita, sedia a rotelle consigliata solo per il tratto pianeggiante"

# ─── Testi pagine listing (luoghi, eventi, notizie) ───────────────────
- name: "sito_pagine"
  label: "📄 Testi pagine listing"
  files:
    - label: "Pagine (Luoghi / Eventi / Notizie)"
      name: "pagine"
      file: "_sito/pagine.json"
      fields:
        - label: "Pagina I Luoghi"
          name: "luoghi"
          widget: "object"
          fields:
            - { label: "Tag (piccolo sopra il titolo)", name: "tag",      widget: "string" }
            - { label: "Titolo IT",                    name: "titolo",    widget: "string" }
            - { label: "Titolo EN",                    name: "titolo_en", widget: "string", required: false }
        - label: "Pagina Eventi"
          name: "eventi"
          widget: "object"
          fields:
            - { label: "Tag",      name: "tag",      widget: "string" }
            - { label: "Titolo IT",name: "titolo",   widget: "string" }
            - { label: "Titolo EN",name: "titolo_en",widget: "string", required: false }
            - label: "Categorie (pillole filtro)"
              name: "categorie"
              widget: "list"
              fields:
                - { label: "ID (valore tecnico)", name: "id",        widget: "string" }
                - { label: "Etichetta visibile",  name: "etichetta", widget: "string" }
        - label: "Pagina Notizie"
          name: "notizie"
          widget: "object"
          fields:
            - { label: "Tag",      name: "tag",      widget: "string" }
            - { label: "Titolo IT",name: "titolo",   widget: "string" }
            - { label: "Titolo EN",name: "titolo_en",widget: "string", required: false }
            - label: "Categorie sidebar"
              name: "sidebar_categorie"
              widget: "list"
              field:
                label: "Categoria"
                name: "voce"
                widget: "string"
