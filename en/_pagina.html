  <script>
  (async function() {
    // Legge lo slug dall'URL: /en/nome-pagina → "nome-pagina"
    var parts = window.location.pathname.split('/').filter(Boolean);
    var slug = parts[parts.length - 1].replace('.html', '');
    var base = '../';

    var dati = null;
    try {
      var r = await fetch(base + '_en/' + slug + '.json');
      if (r.ok) dati = await r.json();
    } catch(e) {}

    if (!dati) {
      document.getElementById('pagina-titolo').textContent = 'Page not found';
      document.title = 'Not found — P.A.S.T.';
      return;
    }

    // Titolo
    var titolo = dati.titolo || 'P.A.S.T.';
    document.getElementById('page-title').textContent = titolo + ' — P.A.S.T.';
    document.title = titolo + ' — P.A.S.T.';
    document.getElementById('pagina-titolo').textContent = titolo;

    // Tag
    var tagEl = document.getElementById('pagina-tag');
    if (dati.tag) {
      tagEl.textContent = dati.tag;
      tagEl.style.display = '';
    }

    // Hero immagine
    if (dati.immagine_hero) {
      var h = document.getElementById('pagina-hero');
      h.style.backgroundImage = "url('" + base + dati.immagine_hero.replace(/^\//,'') + "')";
      h.style.backgroundSize = 'cover';
      h.style.backgroundPosition = 'center';
    }

    // Link IT/EN
    if (dati.it_url) {
      document.getElementById('nav-link-it').href = '../' + dati.it_url;
    }

    // Contenuto (markdown semplice → HTML)
    var md = dati.contenuto || '';
    md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    md = md.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
    md = md.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
    md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    md = md.replace(/\*(.+?)\*/g,     '<em>$1</em>');
    md = md.replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
    md = md.replace(/\n\n/g, '</p><p>');
    md = md.replace(/\n/g, '<br>');
    document.getElementById('pagina-contenuto').innerHTML =
      '<p>' + md + '</p>'
      + '<p style="margin-top:2rem"><a href="index.html" class="back-link">← Back to home</a></p>';
  })();
  </script>
